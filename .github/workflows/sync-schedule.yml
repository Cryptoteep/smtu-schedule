name: Daily SMTU Schedule Auto-Sync

on:
  schedule:
    # Run 4 times a day (05:17, 11:17, 17:17, 23:17 MSK)
    # Minute 17 avoids peak hourly cron loads on smtu.ru servers
    - cron: '17 2,8,14,20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "sync-and-deploy"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run SMTU schedule scraper
        run: node tools/sync-smtu.mjs

      - name: Build production bundle
        run: npm run build

      - name: Commit updated schedule data if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/ src/data/teachers.json src/data/sampleTeachers.json src/data/sampleSchedules.json
          if git diff --staged --quiet; then
            echo "No schedule changes detected."
          else
            git commit -m "chore(sync): automated schedule update from smtu.ru [skip ci]"
            git pull --rebase origin master || true
            git push origin master
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
